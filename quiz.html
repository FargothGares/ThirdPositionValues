<head>
<link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:400,700" rel="stylesheet">
<link href='style.css' rel='stylesheet' type='text/css'>
<title>ThirdPositionValues Quiz</title>
<link rel="icon" type="x-icon" href="3Pvaluesicon.png">
<link rel="shortcut icon" type="x-icon" href="3Pvaluesicon.png">
<meta charset="utf-8">
<script async src="//pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
<script>
  (adsbygoogle = window.adsbygoogle || []).push({
    google_ad_client: "ca-pub-6511426299019766",
    enable_page_level_ads: true
  });
</script>
</head>
<body>
<script type="application/javascript"
        src="questions.js">
</script>
<img src="ThirdPositionValues.png" class="center"></img>
<hr>
<h2 style="text-align:center;" id="question-number">It should appear</h2>
<p class="question" id="question-text"></p>
<button class="button" onclick="next_question( 1.0)" style="background-color: #A94F3D  ;">Strongly Agree</button> <br>
<button class="button" onclick="next_question( 0.5)" style="background-color: #C98252  ;">Agree</button> <br>
<button class="button" onclick="next_question( 0.0)" style="background-color: #8C8175  ;">Neutral</button> <br>
<button class="button" onclick="next_question(-0.5)" style="background-color: #7C6254  ;">Disagree</button> <br>
<button class="button" onclick="next_question(-1.0)" style="background-color: #573F3A;">Strongly Disagree</button> <br>
<button class="small_button" onclick="prev_question()" id="back_button">Back</button>

<script>
    var max_b1, max_b2, max_b3, max_b4, max_b5, max_b6, max_b7, max_b8; // Max possible scores
    max_b1 = max_b2 = max_b3 = max_b4 = max_b5 = max_b6 = max_b7 = max_b8 = 0;

    var b1, b2, b3, b4, b5, b6, b7, b8; // User's scores
    b1 = b2 = b3 = b4 = b5 = b6 = b7 = b8 = 0;

    var qn = 0; // Question number
    var recorded_answers; // Records how your answer to each question impacts your results

    var long_quiz = sessionStorage.getItem("long_quiz") === 'y';  // Whether the questions are to be randomised
    var random_quiz = sessionStorage.getItem("random_quiz") === 'y'; // Whether the quiz is to be long or short

    var test_questions; // The question list to be used by the test

    var random_questions; // The randomised question list
    var random_index; // The random index number, used when randomising the question list

    var small_questions = new Array (questions.length/2); // The shortened question list
    var small_question_iterator = 0 // Used to add questions to the shortened question list

    for(var i = 0; i < questions.length; i++)
    {   
        if(i % 10 < 5)
        {
            small_questions[small_question_iterator] = questions[i];
            small_question_iterator++;
        }
    }

    if(long_quiz)
    {
        test_questions = questions;
    }
    else
    {
        test_questions = small_questions;
    }

    if(random_quiz)
    {
        random_questions = new Array(test_questions.length);
        random_index = get_random_int(test_questions.length);
        for(var i = 0; i < test_questions.length; i++)
        {
            while(random_questions[random_index] != null)
            {
                random_index = get_random_int(test_questions.length);
            }
            random_questions[random_index] = test_questions[i];
        }
        test_questions = random_questions;
    }

    recorded_answers = new Array(test_questions.length);

    init_question();

    for (var i = 0; i < test_questions.length; i++) 
    {
        max_b1 += Math.abs(test_questions[i].effect.b1)
        max_b2 += Math.abs(test_questions[i].effect.b2)
        max_b3 += Math.abs(test_questions[i].effect.b3)
        max_b4 += Math.abs(test_questions[i].effect.b4)
        max_b5 += Math.abs(test_questions[i].effect.b5)
        max_b6 += Math.abs(test_questions[i].effect.b6)
        max_b7 += Math.abs(test_questions[i].effect.b7)
        max_b8 += Math.abs(test_questions[i].effect.b8)
    }
    function init_question() 
    {
        document.getElementById("question-text").innerHTML = test_questions[qn].question;
        document.getElementById("question-number").innerHTML = "Question " + (qn + 1) + " of " + (test_questions.length);

    }

    function next_question(mult) 
    {
        b1 += mult*test_questions[qn].effect.b1
        b2 += mult*test_questions[qn].effect.b2
        b3 += mult*test_questions[qn].effect.b3
        b4 += mult*test_questions[qn].effect.b4
        b5 += mult*test_questions[qn].effect.b5
        b6 += mult*test_questions[qn].effect.b6
        b7 += mult*test_questions[qn].effect.b7
        b8 += mult*test_questions[qn].effect.b8
        recorded_answers[qn] = mult;
        qn++;

        if (qn < test_questions.length) 
        {
            init_question();
        } 
        else 
        {
            results();
        }
    }

    function prev_question()
    {
        if(qn > 0)
        {
            qn--;
            b1 -= recorded_answers[qn] * test_questions[qn].effect.b1;
            b2 -= recorded_answers[qn] * test_questions[qn].effect.b2;
            b3 -= recorded_answers[qn] * test_questions[qn].effect.b3;
            b4 -= recorded_answers[qn] * test_questions[qn].effect.b4;
            b5 -= recorded_answers[qn] * test_questions[qn].effect.b5;
            b6 -= recorded_answers[qn] * test_questions[qn].effect.b6;
            b7 -= recorded_answers[qn] * test_questions[qn].effect.b7;
            b8 -= recorded_answers[qn] * test_questions[qn].effect.b8;
            init_question();
        }
        else
        {
            window.location.href = "quiz_selection.html";
        }
    }

    function calc_score(score,max)
    {
        return (100*(max+score)/(2*max)).toFixed(1)
    }

    function results() 
    {
        location.href = `results.html`
            + `?v1=${calc_score(b1,max_b1)}`
            + `&v3=${calc_score(b2,max_b2)}`
            + `&v5=${calc_score(b3,max_b3)}`
            + `&v7=${calc_score(b4,max_b4)}`
            + `&v9=${calc_score(b5,max_b5)}`
            + `&v11=${calc_score(b6,max_b6)}`
            + `&v13=${calc_score(b7,max_b7)}`
            + `&v15=${calc_score(b8,max_b8)}`
    }

    function get_random_int(max)
    {
        return Math.floor(Math.random() * max);
    }
</script>
</body>
